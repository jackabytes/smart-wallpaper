name: Update Wallpaper
"on":
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: wallpaper-update
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Astral
        run: pip install astral
      - name: Generate wallpaper feed
        run: python generate.py
      - name: Show generated wallpaper
        run: cat wallpaper.json
      - name: Prepare Pages
        run: |
          mkdir public
          cp wallpaper.json public/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4