name: Cron Test

# Testing GitHub scheduled workflows

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cron-test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm scheduled run
        run: |
          echo "CRON TEST RAN"
          echo "UTC time: $(date -u)"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"